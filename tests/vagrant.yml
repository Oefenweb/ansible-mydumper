---
- name: converge
  hosts: all
  remote_user: vagrant
  become: true
  pre_tasks:
    - name: include variables
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - "{{ playbook_dir }}/vars/_{{ ansible_distribution_release }}.yml"
        - "{{ playbook_dir }}/vars/_{{ ansible_distribution | lower }}.yml"
        - "{{ playbook_dir }}/vars/_default.yml"
  roles:
    - ../../
